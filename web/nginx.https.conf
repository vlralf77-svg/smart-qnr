# =====================================================================
# SmartQnR nginx — HTTPS(TLS) 운영 템플릿
#  사용법:
#   1) 인증서를 컨테이너에 마운트: /etc/nginx/certs/fullchain.pem, privkey.pem
#      (docker-compose.prod.yml 의 web volumes 참고)
#   2) 이 파일을 default.conf 로 사용하도록 이미지/compose 에서 교체
#   3) server_name 을 실제 도메인으로 변경
# =====================================================================

# HTTP → HTTPS 강제 리다이렉트
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name qnr.hospital.example.com;   # ← 실제 도메인으로 변경

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;

  # --- TLS ---
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # --- 보안 헤더 ---
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # CSP — 앱은 인라인 스타일(MUI/emotion)과 data: 이미지 사용. 필요 시 조정.
  add_header Content-Security-Policy
    "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # 서버 간 통신 HTTPS — nginx → backend(WAS) 구간도 TLS 로 암호화
    #   backend 는 SERVER_SSL_ENABLED=true 로 내부 사설 인증서를 사용해 8080/HTTPS 로 기동.
    proxy_pass         https://backend:8080;
    proxy_http_version 1.1;
    # 내부 사설 CA 로 백엔드 인증서 검증(SNI = backend). 인증서 SAN 에 DNS:backend 필요.
    #   scripts/gen-internal-certs.sh 가 CA(internal-ca.pem)와 backend 인증서를 생성한다.
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_server_name         on;
    proxy_ssl_name                backend;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal-ca.pem;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    # (빠른 구동/디버깅이 필요하면 위 두 줄을 'proxy_ssl_verify off;' 로 대체 — 암호화는 유지)
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
