<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- SmartQnR 앱 아이콘 — "휴대폰 문진"(모바일 문진). 라이트 배경 + 네이비 폰. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#d9e6f6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#sheen)"/>
  <!-- 흰 바탕에서도 가장자리가 보이도록 아주 옅은 테두리 -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="114" fill="none" stroke="#24456d" stroke-opacity="0.12" stroke-width="3"/>
  <!-- 폰(네이비) -->
  <rect x="168" y="92" width="176" height="328" rx="36" fill="#24456d"/>
  <rect x="188" y="126" width="136" height="234" rx="15" fill="#f2f7fd"/>
  <rect x="206" y="146" width="100" height="20" rx="8" fill="#4a90d9"/>
  <rect x="206" y="188" width="100" height="12" rx="6" fill="#c3d0e0"/>
  <rect x="206" y="212" width="72" height="12" rx="6" fill="#c3d0e0"/>
  <path d="M204 300 l28 28 l64 -74" fill="none" stroke="#2fb27a"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="236" y="388" width="40" height="8" rx="4" fill="#b9c8db"/>
</svg>
